[package]
name = "ai-sre"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "BodhiSpace AI SRE control-plane foundation"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ai-sre"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
missing_docs = "deny"
